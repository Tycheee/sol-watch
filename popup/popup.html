<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Sol Watch 设置</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <h1>Sol Watch <span>小Sol的小天才手表</span></h1>

    <div class="group">
      <div class="row">
        <label for="sw-user">在聊天界面显示时间</label>
        <input type="checkbox" id="sw-user" />
      </div>
      <div class="row">
        <label for="sw-assistant">同时显示 assistant 回复时间</label>
        <input type="checkbox" id="sw-assistant" />
      </div>
      <div class="row">
        <label for="sw-send-mode">发送时间</label>
        <select id="sw-send-mode">
          <option value="session">会话锚点（推荐）</option>
          <option value="always">每条消息</option>
          <option value="off">关闭</option>
        </select>
      </div>
      <p class="hint mode-hint">会话锚点：每个会话首次发送、距上次注入满 30 分钟或跨天后注入；编辑/重发会更新时间。</p>
      <div class="row">
        <label for="sw-debugLine">在正文中显示时间元数据调试行</label>
        <input type="checkbox" id="sw-debugLine" />
      </div>
      <div class="row">
        <label for="sw-debug">调试日志</label>
        <input type="checkbox" id="sw-debug" />
      </div>
    </div>

    <div class="group">
      <div class="row">
        <span class="static-label">时间制式</span>
        <span class="radios">
          <label><input type="radio" name="fmt" value="24" id="fmt-24" /> 24 小时制</label>
          <label><input type="radio" name="fmt" value="12" id="fmt-12" /> 12 小时制</label>
        </span>
      </div>
    </div>

    <button id="btn-reset" type="button">恢复默认设置</button>
    <p class="hint">设置仅保存在本地浏览器（chrome.storage.local），无账号、无云同步、无网络请求。</p>
  </div>

  <script src="../src/content/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
